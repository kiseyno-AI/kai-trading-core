<svg xmlns="http://www.w3.org/2000/svg" id="fig-auto-sell" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-auto-sell-title fig-auto-sell-desc">
<title id="fig-auto-sell-title">Compatibility auto-sell from linked positions</title>
<desc id="fig-auto-sell-desc">Sellable account quantities and linked entry tranches produce watch rows. Observed prices are checked against target and stop thresholds before a dry-run record or an internal compatibility sell submission.</desc>
<style>#fig-auto-sell text{font-family:Arial, Helvetica, sans-serif} #fig-auto-sell .node-sub,#fig-auto-sell .edge-label,#fig-auto-sell .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-auto-sell-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-auto-sell-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-auto-sell-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<path d="M 352 124 L 408 124 A 8 8 0 0 1 416 132 L 416 200 A 8 8 0 0 0 424 208 L 496 208" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-auto-sell-arrow)"/>
