<line x1="1072" y1="280" x2="1072" y2="384" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-auto-sell-arrow)" stroke-dasharray="5,4"/>
<path d="M 1216 228 L 1232 228 A 8 8 0 0 1 1240 236 L 1240 616 A 8 8 0 0 1 1232 624 L 216 624 A 8 8 0 0 1 208 616 L 208 592" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-auto-sell-arrow)" stroke-dasharray="5,4"/>
<path d="M 64 540 L 40 540 A 8 8 0 0 1 32 532 L 32 228 A 8 8 0 0 1 40 220 L 64 220" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-auto-sell-arrow)"/>
