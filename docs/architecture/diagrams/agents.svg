<path d="M 904 312 L 944 312 A 8 8 0 0 0 952 304 L 952 236 A 8 8 0 0 1 960 228 L 1000 228" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-agents-arrow)"/>
