<svg xmlns="http://www.w3.org/2000/svg" id="fig-agents" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-agents-title fig-agents-desc">
<title id="fig-agents-title">Three summaries, two decision lanes</title>
<desc id="fig-agents-desc">Each symbol needs all three specialist summaries before either decider can proceed. Short-term and signal decisions have independent objectives and consume the same required summary bundle.</desc>
<style>#fig-agents text{font-family:Arial, Helvetica, sans-serif} #fig-agents .node-sub,#fig-agents .edge-label,#fig-agents .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-agents-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-agents-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-agents-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<path d="M 264 304 L 296 304 A 8 8 0 0 0 304 296 L 304 132 A 8 8 0 0 1 312 124 L 360 124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-agents-arrow)"/>
