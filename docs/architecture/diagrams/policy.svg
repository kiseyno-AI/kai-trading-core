<svg xmlns="http://www.w3.org/2000/svg" id="fig-policy" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-policy-title fig-policy-desc">
<title id="fig-policy-title">Candidate policy replay and activation</title>
<desc id="fig-policy-desc">Calibration candidates pass through explicit replay and activation. Before promoting a new candidate, the server reruns the replay and validates the submitted evidence.</desc>
<style>#fig-policy text{font-family:Arial, Helvetica, sans-serif} #fig-policy .node-sub,#fig-policy .edge-label,#fig-policy .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-policy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-policy-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-policy-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<line x1="1072" y1="176" x2="1072" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<line x1="928" y1="332" x2="784" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<line x1="496" y1="332" x2="352" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<line x1="208" y1="384" x2="208" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<g id="fig-policy-node-report">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Calibration report</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">manual_review_only = true</text>
</g>
<g id="fig-policy-node-candidate">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Candidate rule / policy</text>
<text class="node-sub" x="640" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">registered candidate version</text>
</g>
<g id="fig-policy-node-replay">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Counterfactual replay</text>
<text class="node-sub" x="1072" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">baseline vs candidate</text>
<text class="node-sub" x="1072" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">fixed horizon + costs</text>
</g>
<g id="fig-policy-node-request">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Explicit activation request</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">activated_by + evidence</text>
</g>
<g id="fig-policy-node-gate">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="508" y="288" width="36" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="526" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">GATE</text>
<text class="node-title" x="640" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Server validation gate</text>
<text class="node-sub" x="640" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">replay rerun</text>
<text class="node-sub" x="640" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">evidence validation</text>
</g>
<g id="fig-policy-node-active">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Active policy version</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">persist active policy</text>
</g>
<g id="fig-policy-node-prompt">
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Signal-decider input</text>
<text class="node-sub" x="208" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">active policy context</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-policy-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
</g>
</svg>
