<svg xmlns="http://www.w3.org/2000/svg" id="fig-orders" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-orders-title fig-orders-desc">
<title id="fig-orders-title">Direct domestic orders and reconciliation</title>
<desc id="fig-orders-desc">Direct buy, sell and amend routes are disabled by default. When explicitly enabled, they use the durable domestic KIS order service. Matched order notices and broker inquiries reconcile persisted order state.</desc>
<style>#fig-orders text{font-family:Arial, Helvetica, sans-serif} #fig-orders .node-sub,#fig-orders .edge-label,#fig-orders .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-orders-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-orders-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-orders-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-orders-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-orders-arrow-link)" marker-start="url(#fig-orders-arrow-link)"/>
<line x1="640" y1="176" x2="640" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-orders-arrow)"/>
<line x1="1072" y1="280" x2="1072" y2="176" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-orders-arrow-link)" marker-start="url(#fig-orders-arrow-link)"/>
<line x1="928" y1="332" x2="784" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-orders-arrow)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-orders-arrow-link)"/>
<line x1="640" y1="384" x2="640" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-orders-arrow)"/>
<g id="fig-orders-node-api">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Direct order API</text>
<text class="node-sub" x="208" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">buy / sell / amend: opt-in</text>
<text class="node-sub" x="208" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">cancel: separate route</text>
</g>
<g id="fig-orders-node-service">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">TradingOrderService</text>
<text class="node-sub" x="640" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">account + client_order_id</text>
<text class="node-sub" x="640" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">replay / conflict / submitting</text>
</g>
<g id="fig-orders-node-kis">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="940" y="80" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="968" y="90" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="1072" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS domestic order REST</text>
<text class="node-sub" x="1072" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">submit / cancel / amend</text>
</g>
<g id="fig-orders-node-reconcile">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Order reconciliation</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">startup / periodic / reconnect</text>
</g>
<g id="fig-orders-node-store">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="508" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="530" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="640" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Orders + events</text>
<text class="node-sub" x="640" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">OrderRequest / BrokerOrder</text>
<text class="node-sub" x="640" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">BrokerOrderEvent</text>
</g>
<g id="fig-orders-node-notice">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="76" y="288" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="104" y="298" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS order-notice WS</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">matched order / fill notices</text>
</g>
<g id="fig-orders-node-monitor">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Order history API</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">lifecycle / timeline</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-orders-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
<line x1="440" y1="694" x2="488" y2="694" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-orders-arrow-link)" marker-start="url(#fig-orders-arrow-link)"/>
<text x="504" y="698" fill="#4f5d75" font-size="12">Request and response / readback</text>
</g>
</svg>
