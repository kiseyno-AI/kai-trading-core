<text class="node-title" x="640" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Outcome evaluation</text>
<text class="node-sub" x="640" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">horizon / costs / coverage</text>
<text class="node-sub" x="640" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">counterfactual outcomes</text>
</g>
<g id="fig-learning-node-calibration">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Calibration</text>
<text class="node-sub" x="1072" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">mature / deduped cohorts</text>
</g>
<g id="fig-learning-node-actual">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="508" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="530" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Actual execution evidence</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">eligible outcomes + manifest</text>
</g>
<g id="fig-learning-node-weekly">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Weekly learning artifact</text>
<text class="node-sub" x="1072" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">explicit publish / immutable</text>
<text class="node-sub" x="1072" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">hash / validity checks</text>
</g>
<g id="fig-learning-node-criteria">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Future decision criteria</text>
<text class="node-sub" x="1072" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">performance_criteria</text>
</g>
<g id="fig-learning-node-review">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Operator review views</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">calendar / reviews</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
</g>
