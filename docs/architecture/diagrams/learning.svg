<svg xmlns="http://www.w3.org/2000/svg" id="fig-learning" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-learning-title fig-learning-desc">
<title id="fig-learning-title">Evaluation and weekly advisory feedback</title>
<desc id="fig-learning-desc">Stored decisions are evaluated against subsequent prices. Mature evaluation cohorts and eligible actual execution evidence feed an immutable weekly artifact whose criteria can inform later decisions.</desc>
<style>#fig-learning text{font-family:Arial, Helvetica, sans-serif} #fig-learning .node-sub,#fig-learning .edge-label,#fig-learning .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-learning-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-learning-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-learning-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<path d="M 352 332 L 408 332 A 8 8 0 0 0 416 324 L 416 164 A 8 8 0 0 1 424 156 L 496 156" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<line x1="1072" y1="176" x2="1072" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<path d="M 784 540 L 848 540 A 8 8 0 0 0 856 532 L 856 356 A 8 8 0 0 1 864 348 L 928 348" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<line x1="1072" y1="384" x2="1072" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<line x1="640" y1="176" x2="640" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-learning-arrow)"/>
<g id="fig-learning-node-snapshots">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="80" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="90" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Decision snapshots</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">valid immutable decisions</text>
</g>
<g id="fig-learning-node-bars">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Subsequent price data</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">stored forward bars</text>
</g>
<g id="fig-learning-node-eval">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
