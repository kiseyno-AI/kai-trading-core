<svg xmlns="http://www.w3.org/2000/svg" id="fig-market-discovery" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-market-discovery-title fig-market-discovery-desc">
<title id="fig-market-discovery-title">Korean symbols, favorites and scanners</title>
<desc id="fig-market-discovery-desc">Symbol search, stored daily rankings and realtime rankings use separate inputs. Realtime ranking results use an in-process TTL cache.</desc>
<style>#fig-market-discovery text{font-family:Arial, Helvetica, sans-serif} #fig-market-discovery .node-sub,#fig-market-discovery .edge-label,#fig-market-discovery .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-market-discovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-market-discovery-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-market-discovery-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-market-discovery-arrow-link)"/>
