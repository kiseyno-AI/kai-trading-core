<line x1="352" y1="540" x2="496" y2="540" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-market-discovery-arrow-link)"/>
<path d="M 784 540 L 848 540 A 8 8 0 0 0 856 532 L 856 368 A 8 8 0 0 1 864 360 L 928 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-discovery-arrow)"/>
