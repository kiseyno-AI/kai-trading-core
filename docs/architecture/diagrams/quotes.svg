<svg xmlns="http://www.w3.org/2000/svg" id="fig-quotes" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-quotes-title fig-quotes-desc">
<title id="fig-quotes-title">Korean quotes and fallbacks</title>
<desc id="fig-quotes-desc">Market state and data availability select the response. If a live quote is unavailable, QuoteService checks a usable daily bar and then same-day quote caches.</desc>
<style>#fig-quotes text{font-family:Arial, Helvetica, sans-serif} #fig-quotes .node-sub,#fig-quotes .edge-label,#fig-quotes .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-quotes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-quotes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-quotes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<path d="M 352 124 L 408 124 A 8 8 0 0 1 416 132 L 416 296 A 8 8 0 0 0 424 304 L 496 304" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-quotes-arrow-link)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)" stroke-dasharray="5,4"/>
<path d="M 352 540 L 408 540 A 8 8 0 0 0 416 532 L 416 368 A 8 8 0 0 1 424 360 L 496 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)" stroke-dasharray="5,4"/>
<line x1="784" y1="332" x2="928" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)"/>
<path d="M 640 384 L 640 532 A 8 8 0 0 0 648 540 L 928 540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)"/>
<g id="fig-quotes-node-live">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="76" y="80" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="104" y="90" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS live quote</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">attempted while the market is open</text>
</g>
<g id="fig-quotes-node-bar">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Stored daily bars</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">fresh daily-bar fallback</text>
</g>
<g id="fig-quotes-node-cache">
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Same-day quote cache</text>
<text class="node-sub" x="208" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">memory + persisted fallback</text>
</g>
<g id="fig-quotes-node-service">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">QuoteService</text>
<text class="node-sub" x="640" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">live &gt; daily bar &gt; cache</text>
<text class="node-sub" x="640" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">otherwise unavailable</text>
</g>
<g id="fig-quotes-node-api">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Quote APIs</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">single / tracked symbols</text>
</g>
<g id="fig-quotes-node-snapshot">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="940" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="962" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="1072" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Persisted quote snapshots</text>
<text class="node-sub" x="1072" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">best-effort live writes</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
<line x1="440" y1="694" x2="488" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-quotes-arrow)" stroke-dasharray="5,4"/>
<text x="504" y="698" fill="#4f5d75" font-size="12">Conditional / compatibility</text>
</g>
</svg>
