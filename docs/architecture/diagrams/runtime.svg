<svg xmlns="http://www.w3.org/2000/svg" id="fig-runtime" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-runtime-title fig-runtime-desc">
<title id="fig-runtime-title">Core layers and startup</title>
<desc id="fig-runtime-desc">HTTP requests and background jobs use domain services in one Python application. SQLAlchemy manages persistence; startup checks database and repair readiness before starting realtime and scheduled work.</desc>
