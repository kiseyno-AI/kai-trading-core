<svg xmlns="http://www.w3.org/2000/svg" id="fig-agent-improvement" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-agent-improvement-title fig-agent-improvement-desc">
<title id="fig-agent-improvement-title">Guarded weekly agent improvement</title>
<desc id="fig-agent-improvement-desc">An optional local schedule runs the signal lab and deterministic findings. Dry-run is the default; opt-in application can propose bounded decider calibration notes by pull request or open deduplicated code issues.</desc>
<style>#fig-agent-improvement text{font-family:Arial, Helvetica, sans-serif} #fig-agent-improvement .node-sub,#fig-agent-improvement .edge-label,#fig-agent-improvement .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
