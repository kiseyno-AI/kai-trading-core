<svg xmlns="http://www.w3.org/2000/svg" id="fig-external-evidence" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-external-evidence-title fig-external-evidence-desc">
<title id="fig-external-evidence-title">External news and macro evidence</title>
<desc id="fig-external-evidence-desc">Symbol news, topic news and macro observations use separate collection and storage paths. Their actual consumers are shown independently from the generic external-context foundation.</desc>
<style>#fig-external-evidence text{font-family:Arial, Helvetica, sans-serif} #fig-external-evidence .node-sub,#fig-external-evidence .edge-label,#fig-external-evidence .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
