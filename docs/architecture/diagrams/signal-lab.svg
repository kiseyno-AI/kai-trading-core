<svg xmlns="http://www.w3.org/2000/svg" id="fig-signal-lab" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-signal-lab-title fig-signal-lab-desc">
<title id="fig-signal-lab-title">Read-only signal evaluation lab</title>
<desc id="fig-signal-lab-desc">Stored KRX bars, factor scores and timestamped agent observations form a shared evaluation panel. Pure scoring functions test rank evidence and non-overlapping top-k returns, then the CLI writes local research reports.</desc>
<style>#fig-signal-lab text{font-family:Arial, Helvetica, sans-serif} #fig-signal-lab .node-sub,#fig-signal-lab .edge-label,#fig-signal-lab .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-signal-lab-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-signal-lab-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-signal-lab-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<line x1="640" y1="176" x2="640" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<path d="M 352 540 L 408 540 A 8 8 0 0 0 416 532 L 416 368 A 8 8 0 0 1 424 360 L 496 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<path d="M 784 304 L 848 304 A 8 8 0 0 0 856 296 L 856 132 A 8 8 0 0 1 864 124 L 928 124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<line x1="784" y1="348" x2="928" y2="348" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<path d="M 1216 124 L 1240 124 A 8 8 0 0 1 1248 132 L 1248 532 A 8 8 0 0 1 1240 540 L 1216 540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<line x1="1072" y1="384" x2="1072" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-signal-lab-arrow)"/>
<g id="fig-signal-lab-node-bars">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="80" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
