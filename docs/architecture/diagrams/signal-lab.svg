<text class="node-title" x="208" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Stored KRX price bars</text>
<text class="node-sub" x="208" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">active KOSPI / KOSDAQ</text>
<text class="node-sub" x="208" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">open / close / volume</text>
</g>
