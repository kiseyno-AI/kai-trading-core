<text class="node-title" x="208" y="543" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Agent scores and decisions</text>
<text class="node-sub" x="208" y="561" text-anchor="middle" fill="#4f5d75" font-size="12">feedback / decision snapshots</text>
<text class="node-sub" x="208" y="578" text-anchor="middle" fill="#4f5d75" font-size="12">stored timestamps</text>
</g>
<g id="fig-signal-lab-node-returns">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Forward returns</text>
<text class="node-sub" x="640" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">next open -&gt; horizon close</text>
<text class="node-sub" x="640" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">1 / 5 / 10 sessions by default</text>
</g>
<g id="fig-signal-lab-node-panel">
