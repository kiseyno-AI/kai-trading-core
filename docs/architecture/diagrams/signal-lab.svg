<text class="node-sub" x="640" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">latest pre-open agent rows</text>
<text class="node-sub" x="640" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">factors + seeded placebo</text>
</g>
<g id="fig-signal-lab-node-tests">
