<text class="node-title" x="1072" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Rank evidence tests</text>
<text class="node-sub" x="1072" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">IC / HAC / non-overlap</text>
<text class="node-sub" x="1072" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">volatility control + verdicts</text>
</g>
<g id="fig-signal-lab-node-simulation">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Top-k cost simulation</text>
<text class="node-sub" x="1072" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">non-overlapping rebalances</text>
<text class="node-sub" x="1072" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">assumed round-trip cost</text>
