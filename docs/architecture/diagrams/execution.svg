<svg xmlns="http://www.w3.org/2000/svg" id="fig-execution" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-execution-title fig-execution-desc">
<title id="fig-execution-title">KR plan registration, activation and readback</title>
<desc id="fig-execution-desc">Core validates decision evidence and persists a plan plus dispatch write-ahead state before registration. It stores the acknowledgement, requests activation separately, and reconciles scoped remote state.</desc>
<style>#fig-execution text{font-family:Arial, Helvetica, sans-serif} #fig-execution .node-sub,#fig-execution .edge-label,#fig-execution .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-execution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-execution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-execution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<line x1="1072" y1="176" x2="1072" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<line x1="928" y1="332" x2="784" y2="332" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-execution-arrow-link)"/>
<line x1="496" y1="332" x2="352" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<line x1="208" y1="384" x2="208" y2="488" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-execution-arrow-link)"/>
<line x1="352" y1="540" x2="496" y2="540" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-execution-arrow-link)"/>
<line x1="784" y1="540" x2="928" y2="540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<g id="fig-execution-node-evidence">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="80" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="90" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Decision evidence</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">snapshot / policy / scope</text>
</g>
<g id="fig-execution-node-validation">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="36" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="526" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">GATE</text>
<text class="node-title" x="640" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Candidate checks</text>
<text class="node-sub" x="640" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">quality / confidence / policy</text>
<text class="node-sub" x="640" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">reference / target / stop</text>
</g>
<g id="fig-execution-node-plan">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="72" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="940" y="80" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="962" y="90" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="1072" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Durable execution plan</text>
<text class="node-sub" x="1072" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">persisted plan item revisions</text>
</g>
<g id="fig-execution-node-binding">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Destination + WAL</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">destination / revision binding</text>
</g>
<g id="fig-execution-node-register">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Register with Exec</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">POST /v4/execution-plans</text>
</g>
<g id="fig-execution-node-activate">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="76" y="288" width="36" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="94" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">GATE</text>
<text class="node-title" x="208" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Store ACK, then activate</text>
<text class="node-sub" x="208" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">persist acknowledgement</text>
<text class="node-sub" x="208" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">separate activation request</text>
</g>
<g id="fig-execution-node-exec">
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="76" y="496" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="104" y="506" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="208" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">External Exec runtime</text>
<text class="node-sub" x="208" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">broker lifecycle boundary</text>
</g>
<g id="fig-execution-node-readback">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="543" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Scoped readback</text>
<text class="node-sub" x="640" y="561" text-anchor="middle" fill="#4f5d75" font-size="12">plans / orders / executions</text>
<text class="node-sub" x="640" y="578" text-anchor="middle" fill="#4f5d75" font-size="12">scoped positions</text>
</g>
<g id="fig-execution-node-stored">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="940" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="962" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="1072" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Stored execution state</text>
<text class="node-sub" x="1072" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">revision-bound remote state</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-execution-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
</g>
</svg>
