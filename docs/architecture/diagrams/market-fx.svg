<svg xmlns="http://www.w3.org/2000/svg" id="fig-market-fx" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-market-fx-title fig-market-fx-desc">
<title id="fig-market-fx-title">Market snapshots and FX</title>
<desc id="fig-market-fx-desc">KRX session state drives snapshot refreshes. KIS index and investor-flow observations are combined with optional USD/KRW data; FX also has a standalone read API.</desc>
<style>#fig-market-fx text{font-family:Arial, Helvetica, sans-serif} #fig-market-fx .node-sub,#fig-market-fx .edge-label,#fig-market-fx .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-market-fx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-market-fx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-market-fx-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<path d="M 352 124 L 408 124 A 8 8 0 0 1 416 132 L 416 296 A 8 8 0 0 0 424 304 L 496 304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow-link)"/>
<line x1="352" y1="540" x2="496" y2="540" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow-link)"/>
<line x1="640" y1="488" x2="640" y2="384" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)" stroke-dasharray="5,4"/>
<line x1="784" y1="332" x2="928" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)"/>
<line x1="1072" y1="384" x2="1072" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)"/>
<line x1="784" y1="540" x2="928" y2="540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)"/>
<g id="fig-market-fx-node-calendar">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Trade date / session</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">KRX trading session</text>
</g>
