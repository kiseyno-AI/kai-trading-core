<rect x="940" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="962" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Market / FX storage</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">current caches / snapshots</text>
</g>
<g id="fig-market-fx-node-api">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Market / FX read APIs</text>
<text class="node-sub" x="1072" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">/market / /fx/koreaexim</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
<line x1="440" y1="694" x2="488" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-market-fx-arrow)" stroke-dasharray="5,4"/>
<text x="504" y="698" fill="#4f5d75" font-size="12">Conditional / compatibility</text>
</g>
</svg>
