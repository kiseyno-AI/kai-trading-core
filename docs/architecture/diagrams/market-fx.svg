<text class="node-title" x="208" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Export-Import Bank of Korea</text>
<text class="node-sub" x="208" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">KoreaExim FX API</text>
</g>
