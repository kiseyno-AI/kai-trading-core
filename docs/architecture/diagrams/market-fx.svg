<rect x="496" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">MarketSnapshotService</text>
<text class="node-sub" x="640" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">refresh lock / bucket claim</text>
<text class="node-sub" x="640" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">coalesced refresh</text>
</g>
<g id="fig-market-fx-node-fx">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">FX service</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">get_exchange_rates</text>
</g>
<g id="fig-market-fx-node-stored">
