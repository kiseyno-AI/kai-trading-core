<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS market observations</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">indices / series / investors</text>
</g>
