<svg xmlns="http://www.w3.org/2000/svg" id="fig-eod-price" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-eod-price-title fig-eod-price-desc">
<title id="fig-eod-price-title">Daily price collection priority</title>
<desc id="fig-eod-price-desc">For daily_auto and daily_stage_run, collection first tries the official market-wide frame cached by market and date. An unusable symbol row falls back to the per-symbol history endpoint.</desc>
<style>#fig-eod-price text{font-family:Arial, Helvetica, sans-serif} #fig-eod-price .node-sub,#fig-eod-price .edge-label,#fig-eod-price .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-eod-price-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-eod-price-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-eod-price-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<line x1="1072" y1="176" x2="1072" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)" stroke-dasharray="5,4"/>
<path d="M 1216 124 L 1232 124 A 8 8 0 0 1 1240 132 L 1240 612 A 8 8 0 0 1 1232 620 L 680 620 A 8 8 0 0 1 672 612 L 672 592" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<path d="M 1072 384 L 1072 532 A 8 8 0 0 1 1064 540 L 784 540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<line x1="640" y1="384" x2="640" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<g id="fig-eod-price-node-request">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Daily collection request</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">daily_auto / daily_stage_run</text>
</g>
<g id="fig-eod-price-node-official">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Official market-wide frame</text>
<text class="node-sub" x="640" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">get_market_ohlcv_by_ticker</text>
<text class="node-sub" x="640" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">market + exact-date cache</text>
</g>
<g id="fig-eod-price-node-check">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="80" width="36" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="958" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">GATE</text>
<text class="node-title" x="1072" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Date / price validation</text>
<text class="node-sub" x="1072" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">OHLC coherence</text>
<text class="node-sub" x="1072" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">volume / turnover</text>
</g>
<g id="fig-eod-price-node-fallback">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Per-symbol fallback</text>
<text class="node-sub" x="1072" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">get_market_ohlcv_by_date</text>
<text class="node-sub" x="1072" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">exact daily-bar filter</text>
</g>
<g id="fig-eod-price-node-store">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="508" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="530" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Persist daily prices</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">daily_price_bars</text>
</g>
<g id="fig-eod-price-node-history">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Historical backfill</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">requested date range</text>
</g>
<g id="fig-eod-price-node-range">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Per-symbol range fetch</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">historical range path</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
<line x1="440" y1="694" x2="488" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-eod-price-arrow)" stroke-dasharray="5,4"/>
<text x="504" y="698" fill="#4f5d75" font-size="12">Conditional / compatibility</text>
</g>
</svg>
