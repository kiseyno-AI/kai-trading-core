<svg xmlns="http://www.w3.org/2000/svg" id="fig-monitoring" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-monitoring-title fig-monitoring-desc">
<title id="fig-monitoring-title">Execution, price and portfolio read models</title>
<desc id="fig-monitoring-desc">Core provides JSON and SSE for external operator clients. Account summaries, persisted Exec readback and WebSocket prices remain distinct read models with their own caches and refresh behavior.</desc>
<style>#fig-monitoring text{font-family:Arial, Helvetica, sans-serif} #fig-monitoring .node-sub,#fig-monitoring .edge-label,#fig-monitoring .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-monitoring-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-monitoring-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-monitoring-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow-link)"/>
<path d="M 784 124 L 848 124 A 8 8 0 0 1 856 132 L 856 296 A 8 8 0 0 0 864 304 L 928 304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow)"/>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow)"/>
<line x1="784" y1="332" x2="928" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow)"/>
<line x1="352" y1="540" x2="496" y2="540" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow-link)"/>
<path d="M 784 540 L 848 540 A 8 8 0 0 0 856 532 L 856 368 A 8 8 0 0 1 864 360 L 928 360" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow)"/>
<line x1="1072" y1="384" x2="1072" y2="488" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow-link)"/>
<g id="fig-monitoring-node-account">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="76" y="80" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="104" y="90" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS account inquiries</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">holdings / account summary</text>
</g>
<g id="fig-monitoring-node-portfolio">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Portfolio cache</text>
<text class="node-sub" x="640" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">summary / stale refresh</text>
</g>
<g id="fig-monitoring-node-readback">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Stored Exec readback</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">plan / order / safety state</text>
</g>
<g id="fig-monitoring-node-runtime">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Execution runtime cache</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">status / board / symbol</text>
</g>
<g id="fig-monitoring-node-ws">
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="76" y="496" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="104" y="506" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="208" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">KIS price WebSocket</text>
<text class="node-sub" x="208" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">monitored symbol subscriptions</text>
</g>
<g id="fig-monitoring-node-prices">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Realtime price snapshot</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">in-memory tick state</text>
</g>
<g id="fig-monitoring-node-api">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Read APIs + SSE</text>
<text class="node-sub" x="1072" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">/portfolio /execution/runtime</text>
<text class="node-sub" x="1072" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">/quotes/realtime</text>
</g>
<g id="fig-monitoring-node-client">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="940" y="496" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="968" y="506" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="1072" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">External dashboard client</text>
<text class="node-sub" x="1072" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">Core exposes backend APIs</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-monitoring-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
</g>
</svg>
