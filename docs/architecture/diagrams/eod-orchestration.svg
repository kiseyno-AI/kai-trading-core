<title id="fig-eod-orchestration-title">Korean EOD execution and recovery</title>
<desc id="fig-eod-orchestration-desc">The automatic scheduler enters PykrxBackfillService. The stage API enters DailyPipelineStageService directly; grouped price stages reuse the same PyKRX collection runner.</desc>
