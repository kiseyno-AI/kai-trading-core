<svg xmlns="http://www.w3.org/2000/svg" id="fig-crypto" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-crypto-title fig-crypto-desc">
<title id="fig-crypto-title">Crypto quotes and analysis context</title>
<desc id="fig-crypto-desc">Crypto reads public Upbit quotations and derives deterministic analysis context. This module provides research and decision support without private-account access or order submission.</desc>
<style>#fig-crypto text{font-family:Arial, Helvetica, sans-serif} #fig-crypto .node-sub,#fig-crypto .edge-label,#fig-crypto .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-crypto-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-crypto-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-crypto-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="332" x2="496" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-crypto-arrow)"/>
<line x1="640" y1="176" x2="640" y2="280" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-crypto-arrow-link)"/>
<line x1="784" y1="332" x2="928" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-crypto-arrow)"/>
<line x1="1072" y1="384" x2="1072" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-crypto-arrow)"/>
<g id="fig-crypto-node-routes">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Crypto read APIs</text>
<text class="node-sub" x="208" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">/market-data/crypto</text>
</g>
<g id="fig-crypto-node-upbit">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f0f0f1" stroke="#2e5aa8" stroke-width="1.3"/>
<rect x="508" y="80" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="536" y="90" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="640" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Upbit public quotations</text>
<text class="node-sub" x="640" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">markets / tickers / candles</text>
</g>
<g id="fig-crypto-node-market">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Normalize / validate data</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">UpbitCryptoMarketDataService</text>
</g>
<g id="fig-crypto-node-features">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Deterministic features</text>
<text class="node-sub" x="1072" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">returns / momentum / volatility</text>
<text class="node-sub" x="1072" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">liquidity / drawdown / levels</text>
</g>
<g id="fig-crypto-node-context">
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="488" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="940" y="496" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="964" y="506" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="543" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Strategy context</text>
<text class="node-sub" x="1072" y="561" text-anchor="middle" fill="#4f5d75" font-size="12">decision_support_only = true</text>
<text class="node-sub" x="1072" y="578" text-anchor="middle" fill="#4f5d75" font-size="12">trading_enabled_in_core = false</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-crypto-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
</g>
</svg>
