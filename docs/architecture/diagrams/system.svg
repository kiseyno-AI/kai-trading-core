<svg xmlns="http://www.w3.org/2000/svg" id="fig-system" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-system-title fig-system-desc">
<title id="fig-system-title">System boundaries</title>
<desc id="fig-system-desc">Core collects market facts, builds decision evidence, and prepares execution plans. OpenClaw and Exec are external integration boundaries; their internal implementations are outside this repository review.</desc>
<style>#fig-system text{font-family:Arial, Helvetica, sans-serif} #fig-system .node-sub,#fig-system .edge-label,#fig-system .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
