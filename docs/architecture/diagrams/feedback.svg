<rect x="940" y="80" width="56" height="14" rx="2" fill="#f0f0f1" stroke="#2e5aa8" stroke-width=".8"/>
<text class="node-tag" x="968" y="90" text-anchor="middle" fill="#2e5aa8" font-size="8" letter-spacing=".5">EXTERNAL</text>
<text class="node-title" x="1072" y="127" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">OpenClaw response</text>
<text class="node-sub" x="1072" y="145" text-anchor="middle" fill="#4f5d75" font-size="12">structured JSON / tool data</text>
<text class="node-sub" x="1072" y="162" text-anchor="middle" fill="#4f5d75" font-size="12">in-band response envelope</text>
</g>
<g id="fig-feedback-node-contract">
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="928" y="280" width="288" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.3"/>
<rect x="940" y="288" width="48" height="14" rx="2" fill="#f2e7e3" stroke="#bf4520" stroke-width=".8"/>
<text class="node-tag" x="964" y="298" text-anchor="middle" fill="#bf4520" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="1072" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Response contract check</text>
<text class="node-sub" x="1072" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">role / symbol / required keys</text>
</g>
<g id="fig-feedback-node-feedback">
<rect x="496" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="508" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="530" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="640" y="343.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Latest feedback</text>
<text class="node-sub" x="640" y="361.5" text-anchor="middle" fill="#4f5d75" font-size="12">agent_context_feedback</text>
</g>
<g id="fig-feedback-node-snapshot">
<rect x="64" y="280" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="280" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="76" y="288" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="98" y="298" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="208" y="335" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Immutable decision snapshot</text>
<text class="node-sub" x="208" y="353" text-anchor="middle" fill="#4f5d75" font-size="12">content fingerprint</text>
<text class="node-sub" x="208" y="370" text-anchor="middle" fill="#4f5d75" font-size="12">both decision lanes</text>
</g>
<g id="fig-feedback-node-ledger">
<rect x="496" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="488" width="288" height="104" rx="6" fill="#ececee" stroke="#4f5d75" stroke-width="1.3"/>
<rect x="508" y="496" width="44" height="14" rx="2" fill="#ececee" stroke="#4f5d75" stroke-width=".8"/>
<text class="node-tag" x="530" y="506" text-anchor="middle" fill="#4f5d75" font-size="8" letter-spacing=".5">STORE</text>
<text class="node-title" x="640" y="551.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Run and failure ledger</text>
<text class="node-sub" x="640" y="569.5" text-anchor="middle" fill="#4f5d75" font-size="12">checkpoint / terminal success</text>
</g>
<g id="fig-feedback-node-consumer">
<rect x="64" y="488" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="488" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="496" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="506" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="543" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Revalidation and consumers</text>
<text class="node-sub" x="208" y="561" text-anchor="middle" fill="#4f5d75" font-size="12">source / lineage checks</text>
<text class="node-sub" x="208" y="578" text-anchor="middle" fill="#4f5d75" font-size="12">evaluation / planning</text>
</g>
<g aria-hidden="true"><line x1="32" y1="668" x2="1248" y2="668" stroke="#bfc0c0" stroke-width=".8"/>
<line x1="40" y1="694" x2="88" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<text x="104" y="698" fill="#4f5d75" font-size="12">Data / call</text>
<line x1="440" y1="694" x2="488" y2="694" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)" stroke-dasharray="5,4"/>
<text x="504" y="698" fill="#4f5d75" font-size="12">Conditional / compatibility</text>
</g>
</svg>
