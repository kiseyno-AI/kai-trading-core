<svg xmlns="http://www.w3.org/2000/svg" id="fig-feedback" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-feedback-title fig-feedback-desc">
<title id="fig-feedback-title">Response validation, retries and history</title>
<desc id="fig-feedback-desc">Retries preserve parent/child run identity and exact role/symbol scopes. Mutable latest feedback and immutable decision snapshots serve different persistence and audit purposes.</desc>
<style>#fig-feedback text{font-family:Arial, Helvetica, sans-serif} #fig-feedback .node-sub,#fig-feedback .edge-label,#fig-feedback .node-tag{font-family:'DejaVu Sans Mono', Consolas, monospace}</style>
<rect width="1280" height="720" fill="#f5f5f5"/>
<defs>
<marker id="fig-feedback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-feedback-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="fig-feedback-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<line x1="352" y1="124" x2="496" y2="124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<line x1="784" y1="124" x2="928" y2="124" fill="none" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#fig-feedback-arrow-link)"/>
<line x1="1072" y1="176" x2="1072" y2="280" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<line x1="928" y1="332" x2="784" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<line x1="496" y1="332" x2="352" y2="332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<rect x="392" y="300" width="64" height="14" rx="2" fill="#f5f5f5"/>
<text class="edge-label" x="424" y="311" text-anchor="middle" fill="#4f5d75" font-size="12">APPEND</text>
<line x1="208" y1="384" x2="208" y2="488" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<path d="M 640 72 L 640 40 A 8 8 0 0 1 648 32 L 1240 32 A 8 8 0 0 1 1248 40 L 1248 532 A 8 8 0 0 1 1240 540 L 784 540" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)"/>
<path d="M 640 592 L 640 620 A 8 8 0 0 1 632 628 L 40 628 A 8 8 0 0 1 32 620 L 32 132 A 8 8 0 0 1 40 124 L 64 124" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#fig-feedback-arrow)" stroke-dasharray="5,4"/>
<g id="fig-feedback-node-parent">
<rect x="64" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="76" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="100" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="208" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Durable retry parent</text>
<text class="node-sub" x="208" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">parent_run_id + exact scope</text>
</g>
<g id="fig-feedback-node-child">
<rect x="496" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
<rect x="496" y="72" width="288" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
<rect x="508" y="80" width="48" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width=".8"/>
<text class="node-tag" x="532" y="90" text-anchor="middle" fill="#2d3142" font-size="8" letter-spacing=".5">MODULE</text>
<text class="node-title" x="640" y="135.5" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600">Child dispatch</text>
<text class="node-sub" x="640" y="153.5" text-anchor="middle" fill="#4f5d75" font-size="12">fresh batch / run identity</text>
</g>
<g id="fig-feedback-node-claw">
<rect x="928" y="72" width="288" height="104" rx="6" fill="#f5f5f5"/>
