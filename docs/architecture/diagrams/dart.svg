<svg xmlns="http://www.w3.org/2000/svg" id="fig-dart" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-dart-title fig-dart-desc">
<title id="fig-dart-title">DART incremental fundamentals</title>
<desc id="fig-dart-desc">Daily refresh scopes corporations and receipt dates, synchronizes disclosures, and captures eligible events. Snapshot rows and successful event status are published in one transaction.</desc>
