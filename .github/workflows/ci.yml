name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kai_trading_test
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: kai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kai -d kai_trading_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://kai:kai@127.0.0.1:5432/kai_trading_test
      DB_AUTO_UPGRADE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate launcher syntax
        run: bash -n start-api.sh

      - name: Compile application modules
        run: python -m compileall -q app

      - name: Import FastAPI application
        run: python -c "from app.main import app"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Verify migration and ORM schema parity
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -q
